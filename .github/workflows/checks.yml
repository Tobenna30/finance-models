name: Model checks
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
